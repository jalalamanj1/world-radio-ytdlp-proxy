name: keepalive

# Render's free plan sleeps a service after ~15 minutes idle, which makes the
# next request take 30-60s. Pinging /health every 10 minutes keeps it warm.
# It follows whatever URL endpoint.txt currently points at (cloud or tunnel).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proxy /health
        run: |
          set -e
          URL="$(curl -fsS https://raw.githubusercontent.com/jalalamanj1/world-radio-ytdlp-proxy/master/endpoint.txt | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "no endpoint"; exit 0; fi
          echo "Pinging $URL/health"
          curl -fsS --max-time 90 "$URL/health" && echo " ok" || echo " ping failed (ignored)"
